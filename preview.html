<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暮色共听 · 动态预览</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141923;color:#e7d6cf;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
  body{display:flex;flex-direction:column}header{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:16px}
  strong{font-size:14px;font-weight:500;letter-spacing:.1em}span{font-size:12px;color:#aeafb8}main{flex:1;position:relative;display:grid;place-items:center;min-height:0}
  #frame{position:relative;overflow:hidden;box-shadow:0 16px 55px #0005}iframe{display:block;width:1920px;height:1080px;border:0;transform-origin:0 0}
  footer{font-size:11px;color:#91949e;text-align:center;padding:16px 20px 22px;line-height:1.7}
</style>
<header><strong>暮色共听</strong><span>动态预览 · 移向边缘，查看更多画面</span></header>
<main><div id="frame"><iframe src="index.html?demo=1&amp;v=18" title="16:9 动态壁纸预览"></iframe></div></main>
<footer>三种夕云交替飘过 · 头发微风 · 轻微呼吸 · 偶尔眨眼 · 城市灯光与倒影<br>预览使用示例歌曲；导入 Wallpaper Engine 请使用 index.html。</footer>
<script>
 const main=document.querySelector('main'),frame=document.getElementById('frame'),view=document.querySelector('iframe');
 function resize(){const scale=Math.min((main.clientWidth-24)/1920,(main.clientHeight-20)/1080);frame.style.width=1920*scale+'px';frame.style.height=1080*scale+'px';view.style.transform='scale('+scale+')';}
 new ResizeObserver(resize).observe(main);resize();
</script>
</html>
